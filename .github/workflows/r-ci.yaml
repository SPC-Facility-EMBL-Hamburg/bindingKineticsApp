name: R-CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ci
          tags: binding-kinetics:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Python
        run: |
          docker run --rm binding-kinetics:latest \
            /home/shiny/myenv/bin/python -c "import pykingenie; print('pykingenie OK')"

      - name: Verify R packages
        run: |
          docker run --rm binding-kinetics:latest Rscript -e '
          required <- c(
            "testthat",
            "shinytest2",
            "reticulate",
            "shiny"
          )

          missing <- required[
            !vapply(required, requireNamespace, logical(1), quietly = TRUE)
          ]

          if (length(missing))
            stop("Missing packages: ", paste(missing, collapse = ", "))

          cat("All required R packages installed.\n")
          '

      - name: Run shinytest2
        run: |
          docker run --rm binding-kinetics:latest \
            Rscript -e '
              Sys.setenv(NOT_CRAN = "true")
              setwd("/home/shiny/KinGenie")

              testthat::test_dir(
                "tests/testthat",
                reporter = testthat::CheckReporter$new()
              )
            '